Log:
  Level: warning # Mức nhật ký: none, error, warning, info, debug
  AccessPath: # /etc/XrayR/access.Log
  ErrorPath: # /etc/XrayR/error.log
DnsConfigPath: # Đường dẫn DNS tùy chỉnh: /etc/XrayR/dns.json
RouteConfigPath: # Đường dẫn định tuyến: /etc/XrayR/route.json
InboundConfigPath: # Đường dẫn inbound tùy chỉnh: /etc/XrayR/custom_inbound.json
OutboundConfigPath: # Đường dẫn outbound tùy chỉnh: /etc/XrayR/custom_outbound.json
ConnectionConfig:
  Handshake: 4 # Thời gian bắt tay tối đa (giây)
  ConnIdle: 30 # Thời gian kết nối nhàn rỗi (giây)
  UplinkOnly: 2 # Thời gian chờ khi chiều tải xuống đóng (giây)
  DownlinkOnly: 4 # Thời gian chờ khi chiều tải lên đóng (giây)
  BufferSize: 64 # Bộ đệm cho mỗi kết nối (kB)
Nodes:
  -
    PanelType: "SSpanel" # Loại panel: SSpanel, V2board, NewV2board, PMpanel, Proxypanel, V2RaySocks
    ApiConfig:
      ApiHost: "http://127.0.0.1:667"
      ApiKey: "123"
      NodeID: 41
      NodeType: V2ray # Loại node: V2ray, Vmess, Vless, Shadowsocks, Trojan, Shadowsocks-Plugin
      Timeout: 30 # Thời gian chờ API (giây)
      EnableVless: false # Bật VLESS cho loại V2ray
      EnableXTLS: false # Bật XTLS cho V2ray và Trojan
      SpeedLimit: 0 # Mbps; giá trị cục bộ ghi đè panel, 0 là tắt
      DeviceLimit: 0 # Giới hạn thiết bị; giá trị cục bộ ghi đè panel, 0 là tắt
      RuleListPath: # Đường dẫn danh sách quy tắc: /etc/XrayR/rulelist
    ControllerConfig:
      ListenIP: 0.0.0.0 # IP lắng nghe
      SendIP: 0.0.0.0 # IP gửi gói tin
      UpdatePeriodic: 60 # Chu kỳ cập nhật thông tin node (giây)
      EnableDNS: false # Dùng DNS tùy chỉnh; hãy cấu hình dns.json trước
      DNSType: AsIs # Chiến lược DNS: AsIs, UseIP, UseIPv4, UseIPv6
      EnableProxyProtocol: false # Chỉ áp dụng với WebSocket và TCP
      AutoSpeedLimitConfig:
        Limit: 0 # Ngưỡng cảnh báo tốc độ (Mbps); 0 là tắt
        WarnTimes: 0 # Số lần cảnh báo trước khi giới hạn; 0 là giới hạn ngay
        LimitSpeed: 0 # Tốc độ sau khi bị giới hạn (Mbps)
        LimitDuration: 0 # Thời gian giới hạn (phút)
      GlobalDeviceLimitConfig:
        Enable: false # Bật giới hạn thiết bị toàn cục cho người dùng
        RedisAddr: 127.0.0.1:6379 # Địa chỉ máy chủ Redis
        RedisPassword: YOUR PASSWORD # Mật khẩu Redis
        RedisDB: 0 # Cơ sở dữ liệu Redis
        Timeout: 5 # Thời gian chờ Redis (giây)
        Expiry: 60 # Thời gian hết hạn (giây)
      EnableFallback: false # Chỉ hỗ trợ Trojan và VLESS
      FallBackConfigs:  # Có thể có nhiều đích fallback
        -
          SNI: # Tên miền TLS; để trống để khớp mọi tên
          Alpn: # ALPN; để trống để khớp mọi giá trị
          Path: # Đường dẫn HTTP; để trống để khớp mọi đường dẫn
          Dest: 80 # Bắt buộc: đích fallback
          ProxyProtocolVer: 0 # Phiên bản PROXY protocol; 0 là tắt
      CertConfig:
        CertMode: dns # Chế độ chứng chỉ: none, file, http, tls, dns; none tắt TLS
        CertDomain: "node1.test.com" # Tên miền của chứng chỉ
        CertFile: /etc/XrayR/cert/node1.test.com.cert # Cần có khi CertMode là file
        KeyFile: /etc/XrayR/cert/node1.test.com.key
        Provider: alidns # Nhà cung cấp DNS: https://go-acme.github.io/lego/dns/
        Email: test@me.com
        DNSEnv: # Biến môi trường cần cho nhà cung cấp DNS
          ALICLOUD_ACCESS_KEY: aaa
          ALICLOUD_SECRET_KEY: bbb
  # Muốn thêm node khác, sao chép một mục trong Nodes và sửa PanelType, ApiConfig,
  # ControllerConfig. Có thể kết nối nhiều panel trong cùng một tiến trình.
